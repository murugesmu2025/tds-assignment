name: TDS GA7 Release Gate

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TDS identity: 24f2007720@ds.study.iitm.ac.in
        run: echo "TDS identity step"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ga7/requirements.txt

      - name: Run tests
        run: |
          pytest -q
